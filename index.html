<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Everyday Yokai Notes</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="brand">
        <h1 id="storyTitle">Story</h1>
        <p class="sub" id="storySubtitle"></p>
      </div>

      <div class="controls" aria-label="Range controls">
        <div class="field">
          <label for="startSel">First</label>
          <select id="startSel" aria-label="First part"></select>
        </div>

        <div class="field">
          <label for="endSel">Last</label>
          <select id="endSel" aria-label="Last part"></select>
        </div>

        <div class="field">
          <label>&nbsp;</label>
          <button id="applyBtn" type="button">Display range</button>
        </div>
      </div>
    </div>

    <div id="notice" class="notice" style="display:none;">
      <strong>Parts not loaded.</strong>
      <div style="margin-top:6px;" id="noticeText"></div>
    </div>

    <main id="content" aria-live="polite"></main>
  </div>

  <script src="./assets/app.js"></script>
</body>
</html>
